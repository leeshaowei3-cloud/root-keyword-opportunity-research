<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">词根查词与机会筛选流程</title>
  <desc id="desc">从冻结批次、双向扩词、可逆清洗、人工语义晋级，到指标、趋势、SERP 与产品机会族的完整流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .step { fill: white; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .gate { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .good { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 18; }
      .hold { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 18; }
      .stop { fill: #fff1f2; stroke: #f43f5e; stroke-width: 2; rx: 18; }
      .text { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #1e293b; text-anchor: middle; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; text-anchor: middle; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .boundary { fill: #1e293b; rx: 14; }
      .boundaryText { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: white; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1400" height="920" fill="url(#bg)"/>
  <text x="700" y="55" class="title" text-anchor="middle">词根查词 → 产品机会族</text>
  <text x="700" y="87" class="subtitle" text-anchor="middle">高召回发现与高成本验证分开；每一步可追溯、可复核、可停止</text>

  <rect x="70" y="135" width="245" height="88" class="step"/>
  <text x="192" y="168" class="text">1. 冻结批次</text>
  <text x="192" y="195" class="small">词根池 · 市场 · 设备 · 预算</text>

  <rect x="385" y="135" width="270" height="88" class="step"/>
  <text x="520" y="168" class="text">2. 双向扩词</text>
  <text x="520" y="195" class="small">前后 A–Z · 数字 · 问题词</text>

  <rect x="725" y="135" width="265" height="88" class="step"/>
  <text x="857" y="168" class="text">3. 保存原始事件</text>
  <text x="857" y="195" class="small">成功 · 零结果 · 失败</text>

  <rect x="1060" y="135" width="270" height="88" class="step"/>
  <text x="1195" y="168" class="text">4. 测量分支</text>
  <text x="1195" y="195" class="small">新词率 · 重复率 · 任务簇 · 漂移</text>

  <path d="M315 179 H385" class="line"/>
  <path d="M655 179 H725" class="line"/>
  <path d="M990 179 H1060" class="line"/>

  <polygon points="1195,270 1325,340 1195,410 1065,340" class="gate"/>
  <text x="1195" y="334" class="text">值得加深？</text>
  <text x="1195" y="360" class="small">按边际信息增益</text>
  <path d="M1195 223 V270" class="line"/>

  <rect x="725" y="286" width="270" height="104" class="good"/>
  <text x="860" y="321" class="text">高产 / 任务明确</text>
  <text x="860" y="348" class="small">Trends · Ads · 竞品词 · SERP</text>
  <text x="860" y="372" class="small">用渠道回答明确未知</text>
  <path d="M1065 340 H995" class="line"/>

  <rect x="385" y="286" width="270" height="104" class="hold"/>
  <text x="520" y="321" class="text">未知 / 反常</text>
  <text x="520" y="348" class="small">抽样一条替代渠道</text>
  <text x="520" y="372" class="small">保留不确定性</text>
  <path d="M725 338 H655" class="line"/>

  <rect x="70" y="286" width="245" height="104" class="stop"/>
  <text x="192" y="321" class="text">饱和 / 漂移</text>
  <text x="192" y="348" class="small">停止当前分支</text>
  <text x="192" y="372" class="small">保留未访问范围与重开条件</text>
  <path d="M385 338 H315" class="line"/>

  <rect x="70" y="475" width="290" height="92" class="step"/>
  <text x="215" y="509" class="text">5. 可逆三分流</text>
  <text x="215" y="538" class="small">规则通过 / 人工复核 / 拒绝</text>
  <path d="M192 390 V475" class="line"/>
  <path d="M520 390 V440 H300 V475" class="line"/>
  <path d="M860 390 V440 H330 V475" class="line"/>

  <polygon points="535,448 690,521 535,594 380,521" class="gate"/>
  <text x="535" y="505" class="text">语义五项齐全？</text>
  <text x="535" y="533" class="small">任务 · 输入 · 输出</text>
  <text x="535" y="556" class="small">数字交付物 · 人工晋级</text>
  <path d="M360 521 H380" class="line"/>

  <rect x="750" y="475" width="240" height="92" class="good"/>
  <text x="870" y="509" class="text">6. 指标补充</text>
  <text x="870" y="538" class="small">同 cohort 三张独立排序</text>
  <path d="M690 521 H750" class="line"/>
  <text x="704" y="505" class="label">是</text>

  <rect x="1060" y="475" width="270" height="92" class="step"/>
  <text x="1195" y="509" class="text">7. Trends + 实时 SERP</text>
  <text x="1195" y="538" class="small">意图 · 供给 · 缺口 · 反证</text>
  <path d="M990 521 H1060" class="line"/>

  <rect x="385" y="635" width="300" height="96" class="hold"/>
  <text x="535" y="670" class="text">不确定：留在复核池</text>
  <text x="535" y="699" class="small">不得猜测后晋级</text>
  <path d="M535 594 V635" class="line"/>

  <polygon points="1195,620 1325,690 1195,760 1065,690" class="gate"/>
  <text x="1195" y="684" class="text">SERP 任务成立？</text>
  <text x="1195" y="712" class="small">pass / hold / fail</text>
  <path d="M1195 567 V620" class="line"/>

  <rect x="750" y="645" width="245" height="92" class="good"/>
  <text x="872" y="679" class="text">8. 聚类产品机会族</text>
  <text x="872" y="708" class="small">用户 · 时刻 · 输入 · 转换 · 交付</text>
  <path d="M1065 690 H995" class="line"/>
  <text x="1016" y="674" class="label">pass</text>

  <rect x="70" y="645" width="245" height="92" class="stop"/>
  <text x="192" y="679" class="text">反证保留</text>
  <text x="192" y="708" class="small">hold / fail 不进入优先池</text>
  <path d="M1065 714 H1025 V790 H192 V737" class="line"/>

  <rect x="680" y="815" width="385" height="58" class="boundary"/>
  <text x="872" y="850" class="boundaryText">决策人明确选择后，才进入真实需求与付费验证</text>
  <path d="M872 737 V815" class="line"/>

  <text x="70" y="895" class="subtitle">边界：自动补全 ≠ 搜索量 ≠ 重复痛点 ≠ 付费意愿 ≠ 开发许可</text>
</svg>
